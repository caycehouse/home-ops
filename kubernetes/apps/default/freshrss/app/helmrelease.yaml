---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: freshrss
spec:
  chartRef:
    kind: OCIRepository
    name: freshrss
  interval: 1h
  values:
    controllers:
      freshrss:
        type: statefulset
        statefulset:
          podManagementPolicy: Parallel
          volumeClaimTemplates:
            - name: config
              accessMode: ReadWriteOnce
              size: 5Gi
              storageClass: miroir-local
              dataSourceRef:
                apiGroup: kopiur.home-operations.com
                kind: Restore
                name: "{{ .Release.Name }}"
              globalMounts:
                - path: /var/www/FreshRSS/data
                  subPath: data
                - path: /var/www/FreshRSS/extensions
                  subPath: extensions
        containers:
          app:
            image:
              repository: ghcr.io/freshrss/freshrss
              tag: 1.31.0-alpine@sha256:2cf8cb46b968cd39f0690938c66c3bf6604404b5125904a35d439c68c006991e
            env:
              CRON_MIN: "*/15"
              LISTEN: &port 80
              TZ: America/New_York
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
    defaultPodOptions:
      hostUsers: false
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.housefam.casa"
        parentRefs:
          - name: envoy-internal
            namespace: network
