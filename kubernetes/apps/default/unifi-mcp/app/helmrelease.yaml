---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unifi-mcp
spec:
  chart:
    kind: OCIRepository
    spec:
      url: oci://ghcr.io/bjw-s-labs/helm/app-template
      ref:
        tag: 5.3.0
  interval: 1h
  values:
    controllers:
      unifi-mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/sirkirby/unifi-network-mcp
              tag: 0.50.3@sha256:33ceb50cf878b80250d56f259ea73b08de54e689a217a0ae780c7c1441fd02a2
            env:
              TZ: America/New_York
              UNIFI_HOST: unifi.internal
              UNIFI_MCP_ALLOWED_HOSTS: localhost,127.0.0.1,unifi-mcp.default.svc.cluster.local
              UNIFI_MCP_HOST: 0.0.0.0
              UNIFI_MCP_HTTP_ENABLED: true
              UNIFI_MCP_PORT: &port 80
              UNIFI_NETWORK_WEBSOCKET_ENABLED: false
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
    service:
      app:
        ports:
          http:
            port: *port
