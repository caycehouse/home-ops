---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: flux-operator-mcp
  interval: 1h
  values:
    readonly: true
    networkPolicy:
      ingress:
        namespaces: [network]
    rbac:
      create: false
    serviceAccount:
      create: false
    resources:
      limits:
        memory: 256Mi
