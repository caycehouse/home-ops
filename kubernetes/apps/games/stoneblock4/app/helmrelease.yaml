---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app stoneblock4
spec:
  chartRef:
    kind: OCIRepository
    name: stoneblock4
  interval: 1h
  timeout: 30m
  values:
    fullnameOverride: *app
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    image:
      repository: ghcr.io/itzg/minecraft-server
      tag: 2026.9.0-java21-graalvm@sha256:e4cebe77e2a81fcdb2ba7cb4b50cc04acf3355d044898d97a47176262aceb06e
      pullPolicy: IfNotPresent
    livenessProbe:
      initialDelaySeconds: 0
      periodSeconds: 10
      failureThreshold: 18
      timeoutSeconds: 5
    readinessProbe:
      initialDelaySeconds: 0
      periodSeconds: 10
      failureThreshold: 3
      timeoutSeconds: 5
    startupProbe:
      # chart only templates failureThreshold/periodSeconds here
      enabled: true
      failureThreshold: 90
      periodSeconds: 10
    serviceAnnotations:
      external-dns.alpha.kubernetes.io/hostname: &hostname stoneblock4.thefryer.games
      external-dns.alpha.kubernetes.io/target: mc-router.thefryer.games
      gatus.home-operations.com/endpoint: |-
        group: services
      mc-router.itzg.me/externalServerName: *hostname
    minecraftServer:
      allowNether: false
      difficulty: "hard"
      eula: "true"
      forcegameMode: true
      ftbModpackId: "130"
      ftbModpackVersionId: "${FTB_MODPACK_VERSION_ID}"
      icon: "https://media.forgecdn.net/avatars/thumbnails/1495/561/256/256/638971627504237551.jpg"
      maxPlayers: 6
      maxTickTime: 180000
      memory: "75%"
      motd: "FTB StoneBlock 4"
      ops: "FryyourBacon"
      overrideServerProperties: true
      # FTB Chunks team claims handle protection, and the lobby is its
      # own dimension that spawn-protection never covers. The pack's 512
      # would only wall non-ops out of the overworld stone mining world.
      spawnProtection: 1
      type: "FTBA"
      viewDistance: 8
      rcon:
        enabled: true
        # Image generates a random password per start and writes it where
        # rcon-cli finds it; existingSecret only suppresses the unused
        # chart-managed rcon Secret.
        withGeneratedPassword: true
        existingSecret: &secret stoneblock4-secret
    persistence:
      dataDir:
        enabled: true
        existingClaim: *app
    extraEnv:
      ALLOW_FLIGHT: "true"
      ENABLE_COMMAND_BLOCK: "true"
      ENABLE_ROLLING_LOGS: "true"
      ENFORCE_WHITELIST: "true"
      OP_PERMISSION_LEVEL: "3"
      OVERRIDE_WHITELIST: "true"
      RCON_CMDS_LAST_DISCONNECT: |-
        stop
      RCON_CMDS_STARTUP: |-
        gamerule playersSleepingPercentage 0
      # The FTB server pack ships both of these and FTBA has no exclude
      # mechanism, so they are deleted after the install instead.
      # default-server-properties rewrites server.properties at init and
      # would drop the whitelist; ftb-backups-3 writes archives into the
      # PVC that kopiur already backs up offsite.
      # INCLUDE is not optional: unset it and the default *.jar wipes
      # every mod in the pack.
      REMOVE_OLD_MODS: "true"
      REMOVE_OLD_MODS_INCLUDE: "default-server-properties-*.jar,ftb-backups-3-*.jar"
      SIMULATION_DISTANCE: "6"
      SNOOPER_ENABLED: "false"
      STOP_DURATION: 180
      STOP_SERVER_ANNOUNCE_DELAY: 60
      SYNC_CHUNK_WRITES: "false"
      USE_MEOWICE_FLAGS: "true"
      USE_MEOWICE_GRAALVM_FLAGS: "true"
    envFrom:
      - secretRef:
          name: *secret
    extraPodSpec:
      terminationGracePeriodSeconds: "300"
    resources:
      requests:
        cpu: 2000m
        memory: &mem 12Gi
      limits:
        memory: *mem
    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
