---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: stoneblock4
spec:
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: kopiur-repository
      namespace: kopiur-system
  interval: 1h
  path: ./kubernetes/apps/games/stoneblock4/app
  postBuild:
    substitute:
      APP: stoneblock4
      # renovate: datasource=custom.ftb-modpack depName=130
      # Numeric FTB version id; 100484 is release 1.20.0. The installer
      # rejects anything non-numeric, so this cannot track the name.
      FTB_MODPACK_VERSION_ID: "100484"
      KOPIUR_CAPACITY: 32Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: games
  wait: false
