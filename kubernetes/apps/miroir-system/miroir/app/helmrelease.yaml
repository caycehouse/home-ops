---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: miroir
spec:
  chartRef:
    kind: OCIRepository
    name: miroir
  interval: 1h
  # The chart has no option for csi-provisioner args. With this gate on, the
  # provisioner needs the ReferenceGrant CRD (from envoy-gateway) and rbac.yaml
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: miroir-controller
            patch: |
              - op: test
                path: /spec/template/spec/containers/1/name
                value: csi-provisioner
              - op: add
                path: /spec/template/spec/containers/1/args/-
                value: --feature-gates=CrossNamespaceVolumeDataSource=true
  values:
    monitoring:
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
      podMonitor:
        enabled: true
      prometheusRule:
        enabled: true
