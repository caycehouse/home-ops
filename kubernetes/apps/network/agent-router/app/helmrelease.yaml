---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agent-router-crds
spec:
  chart:
    kind: OCIRepository
    spec:
      url: oci://mirror.gcr.io/envoyproxy/ai-gateway-crds-helm
      ref:
        tag: 1.3.0
  interval: 1h
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agent-router
spec:
  chart:
    kind: OCIRepository
    spec:
      url: oci://mirror.gcr.io/envoyproxy/ai-gateway-helm
      ref:
        tag: 1.3.0
  dependsOn:
    - name: agent-router-crds
  interval: 1h
  values:
    controller:
      image:
        repository: mirror.gcr.io/envoyproxy/ai-gateway-controller
      mutatingWebhook:
        # The webhook fails closed on pod creation, so only envoy-internal (the
        # gateway serving MCPRoutes) depends on this controller being up.
        objectSelector:
          matchLabels:
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
    extProc:
      image:
        repository: mirror.gcr.io/envoyproxy/ai-gateway-extproc
    envoyGateway:
      namespace: network
