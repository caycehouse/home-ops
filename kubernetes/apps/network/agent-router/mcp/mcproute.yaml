---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/aigateway.envoyproxy.io/mcproute_v1beta1.json
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: MCPRoute
metadata:
  name: agent-router-mcp
spec:
  parentRefs:
    - name: envoy-internal
      sectionName: https
  hostnames:
    - mcp.housefam.casa
  securityPolicy:
    apiKeyAuth:
      credentialRefs:
        - name: agent-router-mcp-secret
      extractFrom:
        - headers:
            - authorization
  backendRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: actual
      path: /http
    - group: gateway.envoyproxy.io
      kind: Backend
      name: flux
    - group: gateway.envoyproxy.io
      kind: Backend
      name: grafana
    - group: gateway.envoyproxy.io
      kind: Backend
      name: home-assistant
    - group: gateway.envoyproxy.io
      kind: Backend
      name: unifi
    - group: gateway.envoyproxy.io
      kind: Backend
      name: victoria-logs
